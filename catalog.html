<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Cubit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=catalog-faces-20261107">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body class="home-page">
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="true"></button>
            <div class="brand-mark" aria-label="Cubit home">Cubit</div>
        </div>
        <div class="user-panel" aria-label="Current user">
            <span class="user-name">ap3</span>
            <button id="logoutBtn" class="logout-btn" type="button">[Logout]</button>
        </div>
    </header>

    <div class="page-shell">
        <aside class="sidebar" aria-label="Sidebar navigation">
            <nav class="sidebar-nav">
                <a class="nav-item" href="index.html#home">Home</a>
                <a class="nav-item" href="index.html#users">Users</a>
                <a class="nav-item" href="games.html">Games</a>
                <a class="nav-item active" href="catalog.html" aria-current="page">Catalog</a>
                <a class="nav-item" href="avatar.html">Avatar</a>
                <a id="createGameLink" class="nav-item" href="create.html" hidden>Create</a>
            </nav>
        </aside>

        <main class="content catalog-content" aria-label="Item catalog">
            <header class="catalog-heading">
                <div>
                    <p class="catalog-kicker">CUBIT / ITEMS</p>
                    <h1>Catalog</h1>
                </div>
                <span id="catalogCount" class="catalog-count">Loading items</span>
            </header>
            <p id="statusMessage" class="status-message" aria-live="polite">Loading catalog...</p>
            <ul id="catalogList" class="catalog-list" aria-label="Catalog items"></ul>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=faces-catalog-20261107" defer></script>
</body>
</html>
