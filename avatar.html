<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar - Cubit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=avatar-faces-20261107">
    <script type="importmap">
        {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
    </script>
</head>
<body class="home-page">
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="true"></button>
            <div class="brand-mark" aria-label="Cubit home">Cubit</div>
        </div>
        <div class="user-panel" aria-label="Current user">
            <span class="user-name">ap3</span>
            <button id="logoutBtn" class="logout-btn" type="button">[Logout]</button>
        </div>
    </header>

    <div class="page-shell">
        <aside class="sidebar" aria-label="Sidebar navigation">
            <nav class="sidebar-nav">
                <a class="nav-item" href="index.html#home">Home</a>
                <a class="nav-item" href="index.html#users">Users</a>
                <a class="nav-item" href="games.html">Games</a>
                <a class="nav-item" href="catalog.html">Catalog</a>
                <a class="nav-item active" href="avatar.html" aria-current="page">Avatar</a>
                <a id="createGameLink" class="nav-item" href="create.html" hidden>Create</a>
            </nav>
        </aside>

        <main class="content avatar-content" aria-label="Player avatar">
            <div class="avatar-workspace">
                <div class="avatar-model-frame">
                    <canvas id="avatarCanvas" aria-label="Player avatar. Use mouse, touch or arrow keys to rotate."></canvas>
                </div>
                <section class="mesh-color-panel" aria-labelledby="meshColorsHeading">
                    <h2 id="meshColorsHeading">Customize avatar</h2>
                    <div class="avatar-editor-tabs" role="tablist" aria-label="Avatar settings">
                        <button class="avatar-editor-tab active" id="avatarColorsTab" type="button" role="tab" aria-selected="true" aria-controls="avatarColorsPanel" data-avatar-panel="avatarColorsPanel">Colors</button>
                        <button class="avatar-editor-tab" id="avatarHatsTab" type="button" role="tab" aria-selected="false" aria-controls="avatarHatsPanel" data-avatar-panel="avatarHatsPanel">Hats</button>
                        <button class="avatar-editor-tab" id="avatarFacesTab" type="button" role="tab" aria-selected="false" aria-controls="avatarFacesPanel" data-avatar-panel="avatarFacesPanel">Faces</button>
                    </div>
                    <div id="avatarColorsPanel" role="tabpanel" aria-labelledby="avatarColorsTab">
                        <p id="meshColorStatus" role="status" aria-live="polite">Loading body colors...</p>
                        <div id="meshColorList" class="mesh-color-list"></div>
                    </div>
                    <div id="avatarHatsPanel" role="tabpanel" aria-labelledby="avatarHatsTab" hidden>
                        <p id="ownedHatStatus" role="status" aria-live="polite">Loading your hats...</p>
                        <div id="ownedHatGrid" class="hat-grid" aria-label="Your hats"></div>
                    </div>
                    <div id="avatarFacesPanel" role="tabpanel" aria-labelledby="avatarFacesTab" hidden>
                        <p id="ownedFaceStatus" role="status" aria-live="polite">Loading your faces...</p>
                        <div id="ownedFaceGrid" class="face-grid" aria-label="Your faces"></div>
                    </div>
                    <button id="saveAvatarBtn" class="save-avatar-btn" type="button">Save</button>
                    <p id="avatarSaveStatus" role="status" aria-live="polite"></p>
                </section>
            </div>
        </main>
    </div>

    <p id="statusMessage" hidden></p>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=avatar-faces-20261107" defer></script>
    <script type="module" src="avatar-editor.js?v=avatar-faces-20261107"></script>
</body>
</html>
